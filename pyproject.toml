[project]
name = "attains-trace"
version = "0.1.0"
description = "Trace any US watershed (HUC12) downstream or upstream and list the impaired waters, causes and TMDLs along the way, from EPA ATTAINS and the USGS Watershed Boundary Dataset; geopandas output and a PostGIS mirror"
readme = "README.md"
license = "BSD-3-Clause"
authors = [{ name = "Andrew Sommerlot" }]
requires-python = ">=3.10"
dependencies = ["geopandas>=0.14", "pandas>=2", "requests>=2.28", "shapely>=2"]

[project.optional-dependencies]
postgis = ["psycopg[binary]>=3.1"]
test = ["pytest>=7", "psycopg[binary]>=3.1"]

[project.scripts]
attains-trace = "attains_trace.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/attains_trace"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests"]
markers = ["network: calls the live EPA and USGS services", "postgis: needs a PostGIS database (ATTAINS_TRACE_PG)"]
