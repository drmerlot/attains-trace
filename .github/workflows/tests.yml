name: tests

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      live:
        description: "Also run the test against the live EPA and USGS services"
        type: boolean
        default: false

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    services:
      postgis:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: attains
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      ATTAINS_TRACE_PG: postgresql://postgres:ci@localhost:5432/attains
      ATTAINS_TRACE_LIVE: ${{ inputs.live && '1' || '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -e ".[test]"
      - run: pytest -q
